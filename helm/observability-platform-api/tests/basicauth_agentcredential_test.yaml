suite: basic auth, agentCredential mode
release:
  name: opa
templates:
  - templates/basicauth/routes.yaml
  - templates/basicauth/securitypolicies.yaml
  - templates/basicauth/referencegrant.yaml
  - templates/basicauth/filters.yaml
values:
  - ../ci/agentcredential-values.yaml
tests:
  - it: renders the read, write and Tempo routes on the Basic Auth hostname
    template: templates/basicauth/routes.yaml
    asserts:
      - hasDocuments:
          count: 8
      - equal:
          path: spec.hostnames
          value:
            - observability-basicauth.test.example.com
      - equal:
          path: spec.parentRefs
          value:
            - name: giantswarm-default
              namespace: envoy-gateway-system
      - isKind:
          of: HTTPRoute
        documentSelector:
          path: metadata.name
          value: opa-mimir-write-api-basicauth
      - isKind:
          of: HTTPRoute
        documentSelector:
          path: metadata.name
          value: opa-loki-write-api-basicauth
      - isKind:
          of: HTTPRoute
        documentSelector:
          path: metadata.name
          value: opa-tempo-read-api-basicauth
      - isKind:
          of: GRPCRoute
        documentSelector:
          path: metadata.name
          value: opa-tempo-read-api-grpc-basicauth
      - isKind:
          of: HTTPRoute
        documentSelector:
          path: metadata.name
          value: opa-tempo-otlp-write-api-basicauth
      - isKind:
          of: GRPCRoute
        documentSelector:
          path: metadata.name
          value: opa-tempo-write-api-grpc-basicauth

  - it: keeps the Mimir read route
    template: templates/basicauth/routes.yaml
    documentSelector:
      path: metadata.name
      value: opa-mimir-read-api-basicauth
    asserts:
      - equal:
          path: spec.rules[0].matches[0].path.value
          value: /prometheus/api/v1/labels

  - it: strips /prometheus on Mimir remote-write and passes OTLP metrics through
    template: templates/basicauth/routes.yaml
    documentSelector:
      path: metadata.name
      value: opa-mimir-write-api-basicauth
    asserts:
      - equal:
          path: metadata.namespace
          value: mimir
      - equal:
          path: spec.rules[0].matches[0].path.value
          value: /prometheus/api/v1/push
      - equal:
          path: spec.rules[0].matches[0].headers[0].name
          value: X-Scope-OrgID
      - equal:
          path: spec.rules[0].filters[0].extensionRef.name
          value: opa-mimir-rewrite
      - equal:
          path: spec.rules[0].backendRefs[0]
          value:
            name: mimir-gateway
            namespace: mimir
            port: 80
      - equal:
          path: spec.rules[1].filters[0].extensionRef.name
          value: opa-mimir-basicauth-headers-check
      - equal:
          path: spec.rules[2].matches[0].path.value
          value: /otlp/v1/metrics
      - equal:
          path: spec.rules[3].filters[0].extensionRef.name
          value: opa-mimir-basicauth-headers-check

  - it: serves Loki native push and OTLP logs
    template: templates/basicauth/routes.yaml
    documentSelector:
      path: metadata.name
      value: opa-loki-write-api-basicauth
    asserts:
      - equal:
          path: spec.rules[0].matches[0].path.value
          value: /loki/api/v1/push
      - equal:
          path: spec.rules[1].filters[0].extensionRef.name
          value: opa-loki-basicauth-headers-check
      - equal:
          path: spec.rules[2].matches[0].path.value
          value: /otlp/v1/logs
      - equal:
          path: spec.rules[2].backendRefs[0]
          value:
            name: loki-gateway
            namespace: loki
            port: 80

  - it: strips /tempo on the Tempo HTTP read route
    template: templates/basicauth/routes.yaml
    documentSelector:
      path: metadata.name
      value: opa-tempo-read-api-basicauth
    asserts:
      - equal:
          path: spec.rules[0].filters[0].extensionRef.name
          value: opa-tempo-rewrite
      - equal:
          path: spec.rules[0].backendRefs[0]
          value:
            name: tempo-query-frontend
            namespace: tempo
            port: 3200
      - equal:
          path: spec.rules[1].filters[0].extensionRef.name
          value: opa-tempo-basicauth-headers-check

  - it: routes Tempo gRPC queries to the query frontend
    template: templates/basicauth/routes.yaml
    documentSelector:
      path: metadata.name
      value: opa-tempo-read-api-grpc-basicauth
    asserts:
      - equal:
          path: spec.rules[0].matches[0].method.service
          value: tempopb\.[^/]+
      - equal:
          path: spec.rules[0].matches[0].headers[0].name
          value: X-Scope-OrgID
      - equal:
          path: spec.rules[0].backendRefs[0]
          value:
            name: tempo-query-frontend
            namespace: tempo
            port: 9095

  - it: routes OTLP/HTTP traces to the distributor
    template: templates/basicauth/routes.yaml
    documentSelector:
      path: metadata.name
      value: opa-tempo-otlp-write-api-basicauth
    asserts:
      - equal:
          path: spec.rules[0].matches[0].path.value
          value: /v1/traces
      - equal:
          path: spec.rules[0].backendRefs[0]
          value:
            name: tempo-distributor
            namespace: tempo
            port: 4318

  - it: routes OTLP/gRPC traces to the distributor
    template: templates/basicauth/routes.yaml
    documentSelector:
      path: metadata.name
      value: opa-tempo-write-api-grpc-basicauth
    asserts:
      - equal:
          path: spec.rules[0].matches[0].method
          value:
            service: opentelemetry.proto.collector.trace.v1.TraceService
            type: Exact
      - equal:
          path: spec.rules[0].backendRefs[0]
          value:
            name: tempo-distributor
            namespace: tempo
            port: 4317

  - it: checks each backend against its own Secret
    template: templates/basicauth/securitypolicies.yaml
    asserts:
      - hasDocuments:
          count: 3
      - notExists:
          path: spec.jwt
      - notEqual:
          path: spec.basicAuth.users.name
          value: observability-platform-api-basic-auth-credentials
      - equal:
          path: spec.basicAuth.users
          value:
            name: mimir-gateway-httproute-auth
            namespace: mimir
        documentSelector:
          path: metadata.name
          value: opa-mimir-basicauth
      - equal:
          path: spec.basicAuth.users
          value:
            name: loki-gateway-httproute-auth
            namespace: loki
        documentSelector:
          path: metadata.name
          value: opa-loki-basicauth
      - equal:
          path: spec.basicAuth.users
          value:
            name: tempo-gateway-httproute-auth
            namespace: tempo
        documentSelector:
          path: metadata.name
          value: opa-tempo-basicauth

  - it: attaches each backend's policy to all of its routes
    template: templates/basicauth/securitypolicies.yaml
    asserts:
      - equal:
          path: spec.targetRefs
          value:
            - group: gateway.networking.k8s.io
              kind: HTTPRoute
              name: opa-mimir-read-api-basicauth
            - group: gateway.networking.k8s.io
              kind: HTTPRoute
              name: opa-mimir-write-api-basicauth
        documentSelector:
          path: metadata.name
          value: opa-mimir-basicauth
      - equal:
          path: spec.targetRefs
          value:
            - group: gateway.networking.k8s.io
              kind: HTTPRoute
              name: opa-tempo-read-api-basicauth
            - group: gateway.networking.k8s.io
              kind: GRPCRoute
              name: opa-tempo-read-api-grpc-basicauth
            - group: gateway.networking.k8s.io
              kind: HTTPRoute
              name: opa-tempo-otlp-write-api-basicauth
            - group: gateway.networking.k8s.io
              kind: GRPCRoute
              name: opa-tempo-write-api-grpc-basicauth
        documentSelector:
          path: metadata.name
          value: opa-tempo-basicauth

  - it: renders no ReferenceGrant for Secrets in the backends' namespaces
    template: templates/basicauth/referencegrant.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: renders a ReferenceGrant per cross-namespace Secret
    template: templates/basicauth/referencegrant.yaml
    set:
      basicAuth.agentCredential.usersSecrets.logs.namespace: monitoring
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: opa-loki-basicauth-users
      - equal:
          path: metadata.namespace
          value: monitoring
      - equal:
          path: spec.from
          value:
            - group: gateway.envoyproxy.io
              kind: SecurityPolicy
              namespace: loki
      - equal:
          path: spec.to
          value:
            - group: ""
              kind: Secret
              name: loki-gateway-httproute-auth

  - it: renders a headers-check filter per backend
    template: templates/basicauth/filters.yaml
    asserts:
      - hasDocuments:
          count: 3

  - it: leaves out a backend whose Secret name is empty
    set:
      basicAuth.agentCredential.usersSecrets.traces.name: ""
    template: templates/basicauth/securitypolicies.yaml
    asserts:
      - hasDocuments:
          count: 2

  - it: does not need the hand-managed Secret
    set:
      basicAuth.usersSecret.name: ""
    template: templates/basicauth/securitypolicies.yaml
    asserts:
      - hasDocuments:
          count: 3

  - it: rejects an unknown mode
    set:
      basicAuth.mode: agentcredential
    template: templates/basicauth/routes.yaml
    asserts:
      - failedTemplate: {}
