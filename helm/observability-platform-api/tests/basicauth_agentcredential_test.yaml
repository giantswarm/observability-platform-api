suite: basic auth, AgentCredential write routes
release:
  name: opa
templates:
  - templates/basicauth/routes.yaml
  - templates/basicauth/securitypolicies.yaml
  - templates/basicauth/referencegrant.yaml
  - templates/basicauth/filters.yaml
values:
  - ../ci/agentcredential-values.yaml
tests:
  - it: adds only the write routes to the hand-managed read routes
    template: templates/basicauth/routes.yaml
    asserts:
      - hasDocuments:
          count: 6
      - equal:
          path: spec.hostnames
          value:
            - observability-basicauth.test.example.com
      - equal:
          path: spec.parentRefs
          value:
            - name: giantswarm-default
              namespace: envoy-gateway-system
      - isKind:
          of: HTTPRoute
        documentSelector:
          path: metadata.name
          value: opa-mimir-read-api-basicauth
      - isKind:
          of: HTTPRoute
        documentSelector:
          path: metadata.name
          value: opa-loki-read-api-basicauth
      - isKind:
          of: HTTPRoute
        documentSelector:
          path: metadata.name
          value: opa-mimir-write-api-basicauth
      - isKind:
          of: HTTPRoute
        documentSelector:
          path: metadata.name
          value: opa-loki-write-api-basicauth
      - isKind:
          of: HTTPRoute
        documentSelector:
          path: metadata.name
          value: opa-tempo-otlp-write-api-basicauth
      - isKind:
          of: GRPCRoute
        documentSelector:
          path: metadata.name
          value: opa-tempo-write-api-grpc-basicauth

  - it: serves no Tempo read route on the Basic Auth hostname
    template: templates/basicauth/routes.yaml
    asserts:
      - notMatchRegex:
          path: metadata.name
          pattern: ^opa-tempo-read

  - it: strips /prometheus on Mimir remote-write and passes OTLP metrics through
    template: templates/basicauth/routes.yaml
    documentSelector:
      path: metadata.name
      value: opa-mimir-write-api-basicauth
    asserts:
      - equal:
          path: metadata.namespace
          value: mimir
      - equal:
          path: spec.rules[0].matches[0].path.value
          value: /prometheus/api/v1/push
      - equal:
          path: spec.rules[0].matches[0].headers[0].name
          value: X-Scope-OrgID
      - equal:
          path: spec.rules[0].filters[0].extensionRef.name
          value: opa-mimir-rewrite
      - equal:
          path: spec.rules[0].backendRefs[0]
          value:
            name: mimir-gateway
            namespace: mimir
            port: 80
      - equal:
          path: spec.rules[1].filters[0].extensionRef.name
          value: opa-mimir-basicauth-headers-check
      - equal:
          path: spec.rules[2].matches[0].path.value
          value: /otlp/v1/metrics
      - equal:
          path: spec.rules[3].filters[0].extensionRef.name
          value: opa-mimir-basicauth-headers-check

  - it: serves Loki native push and OTLP logs
    template: templates/basicauth/routes.yaml
    documentSelector:
      path: metadata.name
      value: opa-loki-write-api-basicauth
    asserts:
      - equal:
          path: spec.rules[0].matches[0].path.value
          value: /loki/api/v1/push
      - equal:
          path: spec.rules[1].filters[0].extensionRef.name
          value: opa-loki-basicauth-headers-check
      - equal:
          path: spec.rules[2].matches[0].path.value
          value: /otlp/v1/logs
      - equal:
          path: spec.rules[2].backendRefs[0]
          value:
            name: loki-gateway
            namespace: loki
            port: 80

  - it: routes OTLP/HTTP traces to the distributor
    template: templates/basicauth/routes.yaml
    documentSelector:
      path: metadata.name
      value: opa-tempo-otlp-write-api-basicauth
    asserts:
      - equal:
          path: spec.rules[0].matches[0].path.value
          value: /v1/traces
      - equal:
          path: spec.rules[0].backendRefs[0]
          value:
            name: tempo-distributor
            namespace: tempo
            port: 4318
      - equal:
          path: spec.rules[1].filters[0].extensionRef.name
          value: opa-tempo-basicauth-headers-check

  - it: routes OTLP/gRPC traces to the distributor
    template: templates/basicauth/routes.yaml
    documentSelector:
      path: metadata.name
      value: opa-tempo-write-api-grpc-basicauth
    asserts:
      - equal:
          path: spec.rules[0].matches[0].method
          value:
            service: opentelemetry.proto.collector.trace.v1.TraceService
            type: Exact
      - equal:
          path: spec.rules[0].matches[0].headers[0].name
          value: X-Scope-OrgID
      - equal:
          path: spec.rules[0].backendRefs[0]
          value:
            name: tempo-distributor
            namespace: tempo
            port: 4317

  - it: renders a read and a write policy for Mimir and Loki, and a write policy for Tempo
    template: templates/basicauth/securitypolicies.yaml
    asserts:
      - hasDocuments:
          count: 5
      - notExists:
          path: spec.jwt

  - it: checks the read routes against the hand-managed Secret only
    template: templates/basicauth/securitypolicies.yaml
    asserts:
      - equal:
          path: spec.basicAuth.users
          value:
            name: observability-platform-api-basic-auth-credentials
            namespace: monitoring
        documentSelector:
          path: metadata.name
          value: opa-mimir-basicauth
      - equal:
          path: spec.targetRefs
          value:
            - group: gateway.networking.k8s.io
              kind: HTTPRoute
              name: opa-mimir-read-api-basicauth
        documentSelector:
          path: metadata.name
          value: opa-mimir-basicauth
      - equal:
          path: spec.basicAuth.users
          value:
            name: observability-platform-api-basic-auth-credentials
            namespace: monitoring
        documentSelector:
          path: metadata.name
          value: opa-loki-basicauth
      - equal:
          path: spec.targetRefs
          value:
            - group: gateway.networking.k8s.io
              kind: HTTPRoute
              name: opa-loki-read-api-basicauth
        documentSelector:
          path: metadata.name
          value: opa-loki-basicauth

  - it: checks each backend's write routes against its own AgentCredential Secret
    template: templates/basicauth/securitypolicies.yaml
    asserts:
      - equal:
          path: spec.basicAuth.users
          value:
            name: mimir-gateway-httproute-auth
            namespace: mimir
        documentSelector:
          path: metadata.name
          value: opa-mimir-basicauth-write
      - equal:
          path: spec.targetRefs
          value:
            - group: gateway.networking.k8s.io
              kind: HTTPRoute
              name: opa-mimir-write-api-basicauth
        documentSelector:
          path: metadata.name
          value: opa-mimir-basicauth-write
      - equal:
          path: spec.basicAuth.users
          value:
            name: loki-gateway-httproute-auth
            namespace: loki
        documentSelector:
          path: metadata.name
          value: opa-loki-basicauth-write
      - equal:
          path: spec.targetRefs
          value:
            - group: gateway.networking.k8s.io
              kind: HTTPRoute
              name: opa-loki-write-api-basicauth
        documentSelector:
          path: metadata.name
          value: opa-loki-basicauth-write
      - equal:
          path: spec.basicAuth.users
          value:
            name: tempo-gateway-httproute-auth
            namespace: tempo
        documentSelector:
          path: metadata.name
          value: opa-tempo-basicauth-write
      - equal:
          path: spec.targetRefs
          value:
            - group: gateway.networking.k8s.io
              kind: HTTPRoute
              name: opa-tempo-otlp-write-api-basicauth
            - group: gateway.networking.k8s.io
              kind: GRPCRoute
              name: opa-tempo-write-api-grpc-basicauth
        documentSelector:
          path: metadata.name
          value: opa-tempo-basicauth-write

  - it: keeps only the hand-managed ReferenceGrant for Secrets in the backends' namespaces
    template: templates/basicauth/referencegrant.yaml
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: opa-basicauth-users

  - it: renders a ReferenceGrant per cross-namespace AgentCredential Secret
    template: templates/basicauth/referencegrant.yaml
    set:
      basicAuth.agentCredential.usersSecrets.logs.namespace: monitoring
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.namespace
          value: monitoring
      - equal:
          path: spec.from
          value:
            - group: gateway.envoyproxy.io
              kind: SecurityPolicy
              namespace: loki
        documentSelector:
          path: metadata.name
          value: opa-loki-basicauth-write-users
      - equal:
          path: spec.to
          value:
            - group: ""
              kind: Secret
              name: loki-gateway-httproute-auth
        documentSelector:
          path: metadata.name
          value: opa-loki-basicauth-write-users

  - it: renders a headers-check filter per backend
    template: templates/basicauth/filters.yaml
    asserts:
      - hasDocuments:
          count: 3

  - it: leaves out a backend whose Secret name is empty
    set:
      basicAuth.agentCredential.usersSecrets.traces.name: ""
    template: templates/basicauth/routes.yaml
    asserts:
      - hasDocuments:
          count: 4

  - it: renders the write routes without the hand-managed read routes
    set:
      basicAuth.usersSecret.name: ""
    template: templates/basicauth/routes.yaml
    asserts:
      - hasDocuments:
          count: 4
      - matchRegex:
          path: metadata.name
          pattern: write-api

  - it: renders only write policies, filters and no hand-managed grant without the read routes
    set:
      basicAuth.usersSecret.name: ""
    asserts:
      - hasDocuments:
          count: 3
        template: templates/basicauth/securitypolicies.yaml
      - matchRegex:
          path: metadata.name
          pattern: -basicauth-write$
        template: templates/basicauth/securitypolicies.yaml
      - hasDocuments:
          count: 3
        template: templates/basicauth/filters.yaml
      - hasDocuments:
          count: 0
        template: templates/basicauth/referencegrant.yaml

  - it: renders nothing when Basic Auth is disabled
    set:
      basicAuth.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: renders nothing without a hostname
    set:
      basicAuth.hostname: ""
    asserts:
      - hasDocuments:
          count: 0
