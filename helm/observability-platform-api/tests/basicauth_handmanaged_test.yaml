suite: basic auth, handManaged mode (default)
release:
  name: opa
templates:
  - templates/basicauth/routes.yaml
  - templates/basicauth/securitypolicies.yaml
  - templates/basicauth/referencegrant.yaml
  - templates/basicauth/filters.yaml
values:
  - ../ci/test-values.yaml
tests:
  - it: renders only the Mimir and Loki read routes
    template: templates/basicauth/routes.yaml
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: HTTPRoute
      - equal:
          path: metadata.name
          value: opa-mimir-read-api-basicauth
        documentIndex: 0
      - equal:
          path: metadata.name
          value: opa-loki-read-api-basicauth
        documentIndex: 1
      - equal:
          path: spec.hostnames
          value:
            - observability-basicauth.test.example.com

  - it: checks both read routes against the single hand-managed Secret
    template: templates/basicauth/securitypolicies.yaml
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: spec.basicAuth.users
          value:
            name: observability-platform-api-basic-auth-credentials
            namespace: monitoring
      - notExists:
          path: spec.jwt
      - equal:
          path: spec.targetRefs
          value:
            - group: gateway.networking.k8s.io
              kind: HTTPRoute
              name: opa-mimir-read-api-basicauth
        documentIndex: 0
      - equal:
          path: spec.targetRefs
          value:
            - group: gateway.networking.k8s.io
              kind: HTTPRoute
              name: opa-loki-read-api-basicauth
        documentIndex: 1

  - it: renders one ReferenceGrant for the hand-managed Secret
    template: templates/basicauth/referencegrant.yaml
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: opa-basicauth-users
      - equal:
          path: metadata.namespace
          value: monitoring
      - equal:
          path: spec.from
          value:
            - group: gateway.envoyproxy.io
              kind: SecurityPolicy
              namespace: loki
            - group: gateway.envoyproxy.io
              kind: SecurityPolicy
              namespace: mimir
      - equal:
          path: spec.to
          value:
            - group: ""
              kind: Secret
              name: observability-platform-api-basic-auth-credentials

  - it: renders a headers-check filter for Mimir and Loki only
    template: templates/basicauth/filters.yaml
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: spec.directResponse.statusCode
          value: 401

  - it: renders nothing when the hand-managed Secret is not set
    set:
      basicAuth.usersSecret.namespace: ""
    asserts:
      - hasDocuments:
          count: 0

  - it: renders nothing when disabled
    set:
      basicAuth.enabled: false
    asserts:
      - hasDocuments:
          count: 0
