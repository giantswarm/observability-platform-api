{{/*
ReferenceGrants for the Basic Auth users Secrets (basicAuth.enabled=true)

Envoy Gateway resolves a SecurityPolicy's Secret reference across namespaces
only when a ReferenceGrant in the Secret's namespace permits it.

  Hand-managed read users: the single users Secret lives outside the mimir/loki
    namespaces, so that one object holds the credentials for every service and
    write access to it can be delegated without granting access to a service
    namespace. One ReferenceGrant lets both read SecurityPolicies read it.
  AgentCredential write users: a Secret in its backend's namespace (the default)
    needs no grant. A Secret in another namespace gets its own, which lets only
    that backend's write SecurityPolicy read only that Secret.
*/}}
{{- if eq (include "basicauth.configured" .) "true" -}}
{{- $namespaces := list }}
{{- range $name := list "mimir" "loki" }}
{{- $service := index $.Values $name }}
{{- if $service.enabled }}
{{- $namespaces = append $namespaces $service.namespace }}
{{- end }}
{{- end }}
{{- if $namespaces }}
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: {{ include "resource.default.name" . }}-basicauth-users
  namespace: {{ .Values.basicAuth.usersSecret.namespace }}
  labels:
    {{- include "labels.common" . | nindent 4 }}
spec:
  from:
  {{- range $namespaces | uniq | sortAlpha }}
  - group: gateway.envoyproxy.io
    kind: SecurityPolicy
    namespace: {{ . }}
  {{- end }}
  to:
  - group: ""
    kind: Secret
    name: {{ .Values.basicAuth.usersSecret.name }}
{{- end }}
{{- end }}
{{- range $backend := include "basicauth.write.backends" . | fromJsonArray }}
{{- if ne $backend.secretNamespace $backend.namespace }}
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: {{ include "resource.default.name" $ }}-{{ $backend.name }}-basicauth-write-users
  namespace: {{ $backend.secretNamespace }}
  labels:
    {{- include "labels.common" $ | nindent 4 }}
spec:
  from:
  - group: gateway.envoyproxy.io
    kind: SecurityPolicy
    namespace: {{ $backend.namespace }}
  to:
  - group: ""
    kind: Secret
    name: {{ $backend.secretName }}
{{- end }}
{{- end }}
