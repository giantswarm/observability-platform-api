{{/*
Basic Auth headers-check filters (basicAuth.enabled=true)

Returns 401 when the X-Scope-OrgID header is missing, mirroring the enforcement
the JWT routes get from <service>/filters.yaml.

These duplicate the per-service headers-check filters rather than reusing them
so that the whole Basic Auth feature stays inside this directory: removing it
is a matter of deleting templates/basicauth and the basicAuth values block,
with no edits to the JWT templates. The objects are inert directResponse
filters, so the duplication costs nothing at runtime.
*/}}
{{- if eq (include "basicauth.configured" .) "true" -}}
{{- range $name := list "mimir" "loki" }}
{{- $service := index $.Values $name }}
{{- if $service.enabled }}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: HTTPRouteFilter
metadata:
  name: {{ include "resource.default.name" $ }}-{{ $name }}-basicauth-headers-check
  namespace: {{ $service.namespace }}
  labels:
    {{- include "labels.common" $ | nindent 4 }}
spec:
  directResponse:
    contentType: text/plain
    statusCode: 401
    body:
      type: Inline
      inline: "Bad Request"
{{- end }}
{{- end }}
{{- end }}
