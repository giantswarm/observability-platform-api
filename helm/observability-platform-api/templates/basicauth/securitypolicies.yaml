{{/*
Basic Auth SecurityPolicies (basicAuth.enabled=true)

One SecurityPolicy per backend served on the Basic Auth hostname, targeting
only that backend's Basic Auth routes and configuring `basicAuth` alone. Its
users Secret is basicAuth.usersSecret in handManaged mode, and the backend's
own Secret in agentCredential mode, so a credential for one backend is refused
on the others.

These are deliberately separate from the JWT SecurityPolicies rather than a
`basicAuth` block added to them: Envoy Gateway runs the jwt and basicAuth
filters sequentially with AND semantics, so a route carrying both rejects
every request regardless of which credential it presents
(https://github.com/envoyproxy/gateway/issues/8491).
*/}}
{{- range $backend := include "basicauth.backends" . | fromJsonArray }}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: {{ include "resource.default.name" $ }}-{{ $backend.name }}-basicauth
  namespace: {{ $backend.namespace }}
  labels:
    {{- include "labels.common" $ | nindent 4 }}
spec:
  targetRefs:
  {{- range $route := include "basicauth.routes" (dict "root" $ "backend" $backend.name) | fromJsonArray }}
  - group: gateway.networking.k8s.io
    kind: {{ $route.kind }}
    name: {{ $route.name }}
  {{- end }}
  basicAuth:
    users:
      name: {{ $backend.secretName }}
      namespace: {{ $backend.secretNamespace }}
{{- end }}
