{{/*
Basic Auth routes (basicAuth.enabled=true)

The routes of each backend served on basicAuth.hostname (see basicauth.routes
for which ones each mode renders). Each reuses the body of the matching JWT
route from <service>/_routes.tpl, so the two hostnames never drift apart: the
only differences are the hostname, the parentRefs, the headers-check filter and
the SecurityPolicy attached to them.

HTTP routes: rule 1 matches path + X-Scope-OrgID header (regex ^.+$) and
forwards to the backend; rule 2 matches the path alone and returns 401 through
this directory's own headers-check filter (see filters.yaml). The path rewrite
filters (Mimir remote-write, Tempo read) are the JWT routes' own.

gRPC routes match only with X-Scope-OrgID present: a request without it gets
no route match, as on the JWT hostname.
*/}}
{{- range $backend := include "basicauth.backends" . | fromJsonArray }}
{{- range $route := include "basicauth.routes" (dict "root" $ "backend" $backend.name) | fromJsonArray }}
---
{{ include $route.template (dict
  "root" $
  "name" $route.name
  "hostname" $.Values.basicAuth.hostname
  "parentRefs" $.Values.basicAuth.parentRefs
  "headersCheck" (printf "%s-%s-basicauth-headers-check" (include "resource.default.name" $) $backend.name)
) }}
{{- end }}
{{- end }}
