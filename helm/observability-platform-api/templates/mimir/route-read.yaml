{{/*
Mimir read API routes (mimir.enabled=true)

Resources:
  - HTTPRoute: routes read requests to mimir-gateway:80 in mimir.namespace.
    Rule 1: matches path + method + X-Scope-OrgID header (regex ^.+$) → forwards to backend.
    Rule 2: matches path + method only (no header) → returns 401 via HTTPRouteFilter.
    Any other method gets Envoy's 404.

Exposed paths and methods (configured via mimir.read.paths):
  GET and POST: /prometheus/api/v1/labels, /prometheus/api/v1/label,
    /prometheus/api/v1/query, /prometheus/api/v1/query_range,
    /prometheus/api/v1/query_exemplars, /prometheus/api/v1/series,
    /prometheus/api/v1/status, /prometheus/api/v1/metadata,
    /prometheus/api/v1/detected_labels
  GET only: /prometheus/api/v1/rules
*/}}
{{- if and .Values.mimir.enabled .Values.auth.jwt.providers -}}
---
{{- $matches := (include "read.matches" (dict "paths" .Values.mimir.read.paths "name" "mimir.read.paths") | fromYaml).matches }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "resource.default.name" . }}-mimir-read-api
  namespace: {{ .Values.mimir.namespace }}
  labels:
    {{- include "labels.common" . | nindent 4 }}
spec:
  {{- with .Values.mimir.parentRefs }}
  parentRefs:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.mimir.hostname }}
  hostnames:
  - {{ tpl . $ | quote }}
  {{- end }}
  rules:
  - backendRefs:
    - name: {{ .Values.mimir.read.backendService }}
      namespace: {{ .Values.mimir.namespace }}
      port: {{ .Values.mimir.read.backendPort }}
    matches:
    {{- range $matches }}
    - path:
        type: PathPrefix
        value: {{ .path }}
      method: {{ .method }}
      headers:
      - name: X-Scope-OrgID
        value: "^.+$"
        type: RegularExpression
    {{- end }}
    filters:
    - type: ResponseHeaderModifier
      responseHeaderModifier:
        set:
        - name: X-Scope-OrgID
          value: "%REQ(X-Scope-OrgID)%"
  - backendRefs:
    - name: {{ .Values.mimir.read.backendService }}
      namespace: {{ .Values.mimir.namespace }}
      port: {{ .Values.mimir.read.backendPort }}
    filters:
    - type: ExtensionRef
      extensionRef:
        group: gateway.envoyproxy.io
        kind: HTTPRouteFilter
        name: {{ include "resource.default.name" . }}-mimir-headers-check
    matches:
    {{- range $matches }}
    - path:
        type: PathPrefix
        value: {{ .path }}
      method: {{ .method }}
    {{- end }}
{{- end }}
